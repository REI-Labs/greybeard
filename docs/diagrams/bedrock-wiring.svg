<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">Option B wiring: Bedrock on EKS with the tofu module</title>
  <desc id="desc">The tofu module creates an IAM role and SSM parameters. You seed the parameters. External Secrets Operator copies them into a Kubernetes Secret that the pod reads. The pod reaches Bedrock through the IAM role, using EKS Pod Identity or IRSA.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" fill="#F7FAFC"/>
  <g id="aws" font-family="system-ui, sans-serif" fill="#1A202C">
    <rect x="20" y="20" width="420" height="360" rx="14" fill="#FFFAF0" stroke="#F6AD55" stroke-dasharray="6 4"/>
    <text x="40" y="44" font-size="12" fill="#975A16" font-weight="600">AWS ACCOUNT (created by the tofu module)</text>
    <!-- SSM -->
    <rect x="40" y="70" width="205" height="130" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="135" y="98" text-anchor="middle" font-size="15" font-weight="600">SSM parameters</text>
    <text x="135" y="122" text-anchor="middle" font-size="12" fill="#4A5568">/greybeard/webhook-secret</text>
    <text x="135" y="140" text-anchor="middle" font-size="12" fill="#4A5568">/greybeard/private-key</text>
    <text x="135" y="158" text-anchor="middle" font-size="12" fill="#4A5568">/greybeard/app-id</text>
    <text x="135" y="176" text-anchor="middle" font-size="12" fill="#4A5568">/greybeard/installation-id</text>
    <!-- IAM role -->
    <rect x="40" y="240" width="190" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="135" y="270" text-anchor="middle" font-size="15" font-weight="600">IAM role</text>
    <text x="135" y="294" text-anchor="middle" font-size="12" fill="#4A5568">bedrock:InvokeModel</text>
    <text x="135" y="312" text-anchor="middle" font-size="12" fill="#4A5568">trust: Pod Identity</text>
    <text x="135" y="330" text-anchor="middle" font-size="12" fill="#4A5568">or IRSA</text>
    <!-- Bedrock -->
    <rect x="260" y="240" width="160" height="110" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="340" y="285" text-anchor="middle" font-size="15" font-weight="600">Amazon Bedrock</text>
    <text x="340" y="307" text-anchor="middle" font-size="12" fill="#4A5568">inference profile</text>
    <!-- You -->
    <rect x="275" y="70" width="150" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="340" y="100" text-anchor="middle" font-size="15" font-weight="600">You</text>
    <text x="340" y="120" text-anchor="middle" font-size="12" fill="#4A5568">seeds the values</text>
  </g>
  <g id="cluster" font-family="system-ui, sans-serif" fill="#1A202C">
    <rect x="480" y="20" width="460" height="360" rx="14" fill="#EDF2F7" stroke="#A0AEC0" stroke-dasharray="6 4"/>
    <text x="500" y="44" font-size="12" fill="#4A5568" font-weight="600">EKS CLUSTER</text>
    <!-- ESO -->
    <rect x="500" y="70" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="595" y="102" text-anchor="middle" font-size="15" font-weight="600">External Secrets</text>
    <text x="595" y="124" text-anchor="middle" font-size="12" fill="#4A5568">ClusterSecretStore</text>
    <!-- Secret -->
    <rect x="730" y="70" width="190" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="825" y="102" text-anchor="middle" font-size="15" font-weight="600">Kubernetes Secret</text>
    <text x="825" y="124" text-anchor="middle" font-size="12" fill="#4A5568">made by the chart</text>
    <!-- Pod -->
    <rect x="730" y="240" width="190" height="110" rx="10" fill="#EBF8FF" stroke="#90CDF4"/>
    <text x="825" y="275" text-anchor="middle" font-size="15" font-weight="600">Greybeard pod</text>
    <text x="825" y="299" text-anchor="middle" font-size="12" fill="#4A5568">service account</text>
    <text x="825" y="317" text-anchor="middle" font-size="12" fill="#4A5568">greybeard</text>
  </g>
  <g id="flows" stroke="#4A5568" stroke-width="2" fill="none">
    <line x1="273" y1="105" x2="249" y2="105" marker-end="url(#arrow)"/>
    <path d="M247,190 L460,190 L460,110 L496,110" marker-end="url(#arrow)"/>
    <line x1="692" y1="110" x2="726" y2="110" marker-end="url(#arrow)"/>
    <line x1="825" y1="152" x2="825" y2="236" marker-end="url(#arrow)"/>
    <path d="M728,295 L620,295 L620,370 L135,370 L135,354" marker-end="url(#arrow)"/>
    <line x1="232" y1="295" x2="256" y2="295" marker-end="url(#arrow)"/>
  </g>
  <g id="flow-labels" font-family="system-ui, sans-serif" font-size="11" fill="#4A5568">
    <text x="300" y="184">read (eso_read_policy_json)</text>
    <text x="815" y="200" text-anchor="end">mounted at pod start</text>
    <text x="240" y="364">assume role (Pod Identity or IRSA)</text>
  </g>
</svg>
