<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
  <title id="title">How a review request flows through a Greybeard deployment</title>
  <desc id="desc">GitHub sends a webhook through the ingress, which routes only /webhook and /health to a single Greybeard pod. The pod reads the pull request from the GitHub API, calls the model provider, and posts one comment. Prometheus scrapes /metrics inside the cluster.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5568"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" fill="#F7FAFC"/>
  <g id="outside" font-family="system-ui, sans-serif" fill="#1A202C">
    <!-- GitHub webhooks -->
    <rect x="20" y="60" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="105" y="95" text-anchor="middle" font-size="15" font-weight="600">GitHub</text>
    <text x="105" y="117" text-anchor="middle" font-size="12" fill="#4A5568">webhook deliveries</text>
    <!-- GitHub API -->
    <rect x="20" y="240" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="105" y="275" text-anchor="middle" font-size="15" font-weight="600">GitHub API</text>
    <text x="105" y="297" text-anchor="middle" font-size="12" fill="#4A5568">GraphQL + REST</text>
    <!-- Model provider -->
    <rect x="770" y="150" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="855" y="185" text-anchor="middle" font-size="15" font-weight="600">Model provider</text>
    <text x="855" y="207" text-anchor="middle" font-size="12" fill="#4A5568">Anthropic or Bedrock</text>
  </g>
  <g id="cluster" font-family="system-ui, sans-serif" fill="#1A202C">
    <rect x="240" y="20" width="490" height="340" rx="14" fill="#EDF2F7" stroke="#A0AEC0" stroke-dasharray="6 4"/>
    <text x="260" y="44" font-size="12" fill="#4A5568" font-weight="600">KUBERNETES CLUSTER</text>
    <!-- Ingress -->
    <rect x="270" y="60" width="180" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="360" y="92" text-anchor="middle" font-size="15" font-weight="600">Ingress</text>
    <text x="360" y="114" text-anchor="middle" font-size="12" fill="#4A5568">/webhook and /health only</text>
    <!-- Greybeard pod -->
    <rect x="520" y="140" width="190" height="100" rx="10" fill="#EBF8FF" stroke="#90CDF4"/>
    <text x="615" y="178" text-anchor="middle" font-size="15" font-weight="600">Greybeard pod</text>
    <text x="615" y="200" text-anchor="middle" font-size="12" fill="#4A5568">replicaCount 1</text>
    <text x="615" y="218" text-anchor="middle" font-size="12" fill="#4A5568">port 8080</text>
    <!-- Prometheus -->
    <rect x="270" y="270" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#CBD5E0"/>
    <text x="360" y="300" text-anchor="middle" font-size="15" font-weight="600">Prometheus</text>
    <text x="360" y="320" text-anchor="middle" font-size="12" fill="#4A5568">ServiceMonitor (optional)</text>
  </g>
  <g id="flows" stroke="#4A5568" stroke-width="2" fill="none" font-family="system-ui, sans-serif">
    <line x1="192" y1="100" x2="266" y2="100" marker-end="url(#arrow)"/>
    <path d="M452,100 L615,100 L615,136" marker-end="url(#arrow)"/>
    <line x1="712" y1="190" x2="766" y2="190" marker-end="url(#arrow)"/>
    <path d="M560,242 L560,258 L194,258" marker-end="url(#arrow)"/>
    <path d="M452,315 L660,315 L660,244" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <g id="flow-labels" font-family="system-ui, sans-serif" font-size="11" fill="#4A5568">
    <text x="200" y="92">POST</text>
    <text x="470" y="92">signed payload</text>
    <text x="300" y="252">read PR, post one comment</text>
    <text x="500" y="308">scrape /metrics</text>
  </g>
</svg>
