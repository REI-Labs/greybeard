apiVersion: v1
kind: Service
metadata:
  name: {{ include "greybeard.fullname" . }}
  labels:
    {{- include "greybeard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "greybeard.selectorLabels" . | nindent 4 }}
  ports:
    - name: http # referenced by the ServiceMonitor endpoint
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
