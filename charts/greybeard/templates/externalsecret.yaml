{{- if and .Values.secrets.externalSecret.enabled (not .Values.secrets.existingSecret) }}
{{- $es := .Values.secrets.externalSecret }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "greybeard.fullname" . }}
  labels:
    {{- include "greybeard.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.secretStoreRef.name }}
    kind: {{ $es.secretStoreRef.kind }}
  target:
    name: {{ include "greybeard.fullname" . }}
    creationPolicy: Owner
  data:
    - secretKey: webhook-secret
      remoteRef:
        key: {{ $es.remoteRefs.webhookSecret }}
    - secretKey: private-key.pem
      remoteRef:
        key: {{ $es.remoteRefs.privateKey }}
    {{- if eq .Values.llm.provider "anthropic" }}
    - secretKey: anthropic-api-key
      remoteRef:
        key: {{ $es.remoteRefs.anthropicApiKey }}
    {{- end }}
    {{- if and (not .Values.github.appId) $es.remoteRefs.appId }}
    - secretKey: app-id
      remoteRef:
        key: {{ $es.remoteRefs.appId }}
    {{- end }}
{{- end }}
