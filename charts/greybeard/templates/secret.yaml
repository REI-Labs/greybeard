{{- if include "greybeard.createSecret" . }}
{{- $c := .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "greybeard.fullname" . }}
  labels:
    {{- include "greybeard.labels" . | nindent 4 }}
type: Opaque
data:
  webhook-secret: {{ $c.webhookSecret | b64enc | quote }}
  private-key.pem: {{ $c.privateKey | b64enc | quote }}
  {{- if and (eq .Values.llm.provider "anthropic") $c.anthropicApiKey }}
  anthropic-api-key: {{ $c.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if $c.appId }}
  app-id: {{ $c.appId | toString | b64enc | quote }}
  {{- end }}
{{- end }}
