{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # EKS Pod Identity associations match on namespace + this name.
  name: {{ include "greybeard.serviceAccountName" . }}
  labels:
    {{- include "greybeard.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
