[package]
name = "greybeard"
version = "0.1.0"
edition = "2021"
description = "The mythical senior engineer who's seen every failure mode — PR review service"
license = "UNLICENSED"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "net", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
futures = "0.3"
axum = { version = "0.8", features = ["json"] }
sha2 = "0.10"
hmac = "0.12"
jsonwebtoken = "10"
base64 = "0.22"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-credential-types = "1"
aws-sigv4 = "1"
http = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
