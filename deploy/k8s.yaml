# Greybeard webhook service — single-file manifest set.
#
# Prereqs (one-time, outside this file):
#   - ECR repo for the image (govorch account, us-east-2) + a pushed tag
#   - namespace `greybeard`
#   - Secret `greybeard-app`:
#       kubectl -n greybeard create secret generic greybeard-app \
#         --from-literal=app-id=4627559 \
#         --from-literal=installation-id=154471131 \
#         --from-literal=webhook-secret=<the App's webhook secret> \
#         --from-file=private-key.pem=$HOME/.config/greybeard/greybeard-app.pem
#   - Pod identity / IRSA granting bedrock:InvokeModel (us-east-2 + us-west-2 profiles)
#
# The host below rides the shared ALB + *.apps.govorch.ai wildcard cert —
# align the ingress annotations with the umbrella-chart conventions in
# GovOrch-Infra before applying (this file uses the common set).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greybeard
  namespace: greybeard
spec:
  replicas: 1 # marker-comment is the state; keep single-writer
  strategy:
    type: Recreate # RollingUpdate would briefly run two writers
  selector:
    matchLabels: { app: greybeard }
  template:
    metadata:
      labels: { app: greybeard }
    spec:
      containers:
        - name: greybeard
          image: <ECR>/greybeard:<tag>
          args: ["serve", "--port", "8080"]
          ports: [{ containerPort: 8080 }]
          env:
            - name: GREYBEARD_PROVIDER
              value: bedrock
            - name: GREYBEARD_LENS_MODEL
              value: us.anthropic.claude-opus-5
            - name: AWS_REGION
              value: us-east-2
            - name: GREYBEARD_APP_ID
              valueFrom: { secretKeyRef: { name: greybeard-app, key: app-id } }
            - name: GREYBEARD_APP_INSTALLATION_ID
              valueFrom: { secretKeyRef: { name: greybeard-app, key: installation-id } }
            - name: GREYBEARD_WEBHOOK_SECRET
              valueFrom: { secretKeyRef: { name: greybeard-app, key: webhook-secret } }
            - name: GREYBEARD_APP_PRIVATE_KEY
              value: /var/run/greybeard/private-key.pem
            - name: GREYBEARD_LOG_FILE
              value: /data/greybeard-runs.jsonl
          volumeMounts:
            - { name: app-key, mountPath: /var/run/greybeard, readOnly: true }
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
      volumes:
        - name: app-key
          secret: { secretName: greybeard-app, items: [{ key: private-key.pem, path: private-key.pem }] }
        - name: data
          emptyDir: {} # swap for a small PVC if run history should survive restarts
---
apiVersion: v1
kind: Service
metadata:
  name: greybeard
  namespace: greybeard
spec:
  selector: { app: greybeard }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: greybeard
  namespace: greybeard
  annotations:
    alb.ingress.kubernetes.io/group.name: govorch-shared
    alb.ingress.kubernetes.io/scheme: internet-facing # default is internal — GitHub must reach /webhook
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: greybeard.apps.govorch.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: greybeard, port: { number: 80 } }
